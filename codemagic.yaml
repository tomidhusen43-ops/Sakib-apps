workflows:
  android-build:
    name: Build Android APK
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      java: 17
    scripts:
      - name: Build Android Debug APK
        script: |
          gradle wrapper
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
    artifacts:
      - app/build/outputs/apk/debug/*.apk
    publishing:
      email:
        recipients:
          - tomidhusen43@gmail.com
        notify:
          success: true
          failure: false
